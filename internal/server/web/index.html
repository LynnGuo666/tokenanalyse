<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Mirror</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">TM</span>
        <div>
          <strong>Token Mirror</strong>
          <small>跨设备 AI CLI 用量统计</small>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="sync-status" class="status-pill">本地模式</span>
        <button id="collect-btn" class="btn secondary">采集本机</button>
        <button id="task-center-btn" class="btn secondary">任务 <span id="task-count" class="task-count">0</span></button>
        <button id="refresh-btn" class="btn secondary">刷新</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <nav>
          <button class="nav-item active" data-view="overview">总览</button>
          <button class="nav-item" data-view="requests">请求日志</button>
          <button class="nav-item" data-view="sessions">会话</button>
          <button class="nav-item" data-view="devices">设备</button>
          <button class="nav-item" data-view="pricing">定价</button>
        </nav>
        <div class="sidebar-foot">
          <span id="agent-version">v0.1.0</span>
          <span>headless</span>
        </div>
      </aside>

      <section class="content">
        <div class="filters">
          <label>
            时间范围
            <select id="range-select">
              <option value="1">今天</option>
              <option value="7" selected>近 7 天</option>
              <option value="30">近 30 天</option>
              <option value="0">全部</option>
            </select>
          </label>
          <label>
            设备
            <select id="device-select"><option value="">全部设备</option></select>
          </label>
          <label>
            应用
            <select id="app-select"><option value="">全部应用</option></select>
          </label>
          <label>
            供应商
            <select id="provider-select"><option value="">全部供应商</option></select>
          </label>
          <label>
            模型
            <select id="model-select"><option value="">全部模型</option></select>
          </label>
        </div>

        <div id="view-overview" class="view">
          <div class="cards" id="summary-cards"></div>
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>用量趋势</h2>
                <p id="trend-subtitle">Token / 请求 / 费用</p>
              </div>
              <div class="segmented" id="trend-metric">
                <button class="active" data-metric="tokens">Tokens</button>
                <button data-metric="requests">请求</button>
                <button data-metric="cost">费用</button>
              </div>
            </div>
            <div id="trend-chart" class="chart"></div>
          </div>
          <div class="grid-2">
            <div class="panel">
              <div class="panel-head"><h2>供应商</h2></div>
              <div class="table-wrap"><table id="provider-table"></table></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h2>模型</h2></div>
              <div class="table-wrap"><table id="model-table"></table></div>
            </div>
          </div>
        </div>

        <div id="view-requests" class="view hidden">
          <div class="panel">
            <div class="panel-head">
              <div><h2>请求日志</h2><p>最近采集的模型调用</p></div>
              <div class="pagination">
                <button id="prev-page" class="btn secondary">上一页</button>
                <span id="page-label">1</span>
                <button id="next-page" class="btn secondary">下一页</button>
              </div>
            </div>
            <div class="table-wrap"><table id="request-table"></table></div>
          </div>
        </div>

        <div id="view-sessions" class="view hidden">
          <div class="panel">
            <div class="panel-head"><div><h2>会话</h2><p>按会话汇总请求、Token 与费用</p></div></div>
            <div class="table-wrap"><table id="session-table"></table></div>
          </div>
        </div>

        <div id="view-devices" class="view hidden">
          <div class="panel">
            <div class="panel-head"><div><h2>设备</h2><p>按设备查看采集状态与用量</p></div></div>
            <div id="device-cards" class="device-grid"></div>
          </div>
        </div>

        <div id="view-pricing" class="view hidden">
          <div class="panel">
            <div class="panel-head">
              <div><h2>模型定价</h2><p>价格单位为每百万 Token，统计按当前价格实时重算</p></div>
              <div style="display:flex;gap:8px">
                <button id="sync-models-dev" class="btn secondary">同步 models.dev</button>
                <button id="recalculate-pricing" class="btn secondary">重算费用</button>
                <button id="reload-pricing" class="btn secondary">重新加载</button>
              </div>
            </div>
            <div id="pricing-sync" class="muted" style="margin-bottom:12px"></div>
            <div class="table-wrap"><table id="pricing-table"></table></div>
          </div>
          <div class="panel">
            <div class="panel-head"><div><h2>模型别名 / 变体</h2><p>将原始模型名映射到统一模型 ID</p></div></div>
            <div class="alias-form">
              <input id="alias-pattern" placeholder="原始模型名或前缀" />
              <input id="alias-canonical" placeholder="标准模型 ID" />
              <select id="alias-match"><option value="exact">精确</option><option value="prefix">前缀</option><option value="regex">正则</option></select>
              <button id="alias-add" class="btn primary">添加</button>
            </div>
            <div class="table-wrap"><table id="alias-table"></table></div>
          </div>
        </div>
      </section>
    </main>

    <div id="task-overlay" class="task-overlay hidden"></div>
    <aside id="task-drawer" class="task-drawer hidden">
      <div class="task-drawer-head">
        <div><h2>任务中心</h2><p>所有状态变更操作都会在这里显示</p></div>
        <button id="task-close" class="btn secondary">关闭</button>
      </div>
      <div id="task-list" class="task-list"></div>
    </aside>

    <div id="toast" class="toast hidden"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
